# 主实验唯一默认配置：Trajectory-Level RLOO、完整奖励、联合训练。
# 使用与 VERL 相同的 Hydra/OmegaConf 配置与 key=value 命令行覆盖。
# 示例：./scripts/train/rloo/run_rloo.sh rloo.credit_level=turn recipe.learning_rate=5e-7
# 查看配置：./scripts/train/rloo/run_rloo.sh --cfg job（加 --resolve 展开环境变量/插值）。
defaults:
- _self_
- override hydra/job_logging: disabled
- override hydra/hydra_logging: disabled

# run.mode=prepare 只生成计划；默认 run 实际启动训练。
# output_dir 必须是 RL_ARTIFACT_ROOT 下的新实验目录。
# batch_size 非空时复用原分组逻辑按比例调整三源组数；默认64组×K8=512。
run:
  mode: run
  output_dir: null
  resume_from: null
  batch_size: null

# 六项方法/消融参数。各变体根脚本只覆盖与这里不同的字段。
rloo:
  credit_level: sequence
  train_modules: joint
  distance_reward_coefficient: 1.0
  information_reward_coefficient: 0.05
  first_arrival_reward: 1.0
  terminal_success_reward: 1.0

# 实际训练器配方。8节点×16卡、Megatron TP2/PP2/CP8/EP16/ETP1。
# 学习率：learning_rate为动作专家，vlm_learning_rate为大脑。
# 所有既有训练器参数保持原含义；终局奖励从上方rloo插值，不重复定义默认值。
recipe:
  schema: v6_joint_rl_recipe_v1
  slow_model: ${oc.env:SLOW_MODEL}
  fast_backbone: ${oc.env:FAST_BACKBONE}
  dataset_split: train
  nnodes: 8
  learner_gpus_layout: 16,16,16,16,16,16,16,16
  vllm_replicas: 0
  vllm_tp_size: 2
  fast_policy_workers: 8
  rollout_actors: 512
  num_groups_per_step: 64
  group_size: 8
  smoke_cases: 0
  opt_steps: 100
  checkpoint_interval: 2
  max_tool_calls: 50
  learning_rate: 1.0e-06
  vlm_learning_rate: 1.0e-06
  text_loss_coef: 0.1
  text_temperature: 1.0
  terminal_success_reward: ${rloo.terminal_success_reward}
  direction_match_reward: 0.0
  collision_penalty: 0.0
  discount_gamma: 1.0
  process_reward_cap: 0.1
  success_contract: native_success
  ray_address: ${oc.env:RAY_ADDRESS}
  case_manifest: ${oc.env:TRAIN_CASES}
  case_shuffle_seed: 20260926
  keep_last_checkpoints: 2
  weight_decay: 0.0
  rollout_scheduler: completion
  rollout_groups_in_flight: 64
  fast_policy_max_batch_size: 8
  stage_records_per_rpc: 4
  vllm_max_num_seqs: 1024
  vllm_max_num_batched_tokens: 131072
  vllm_gpu_memory_utilization: 0.6
  fast_policy_pipeline: true
  token_balanced_sharding: true
  zero_copy_rollout_payload: false
  learner_parameter_dtype: fp32
  rollout_transport_dtype: bf16
  fsdp_size: -1
  tool_credit_mode: rule_call_loo
  skip_zero_advantage_records: true
  joint_text_fm_forward: false
  local_policy_transport: false
  bf16_gather_before_export: false
  multi_condition_batch_size: 1
  max_condition_tokens: 0
  condition_token_bucket_size: 0
  stream_groups_per_update: 8
  overlap_rollout_learner: false
  direct_vllm_weight_sync: false
  weight_sync_bucket_mb: 4096
  rule_credit_version: v3_terminal_local
  fsdp_forward_prefetch: false
  rollout_background_prefetch: false
  prepare_streamed_wave: false
  full_weight_residency_gib: 0.0
  gradient_checkpointing: true
  fast_causal_attention: false
  fm_suffix_vjp: false
  fm_core_suffix_vjp: false
  dual_shared_recompute: false
  case_sampling: stratified_per_step
  case_sampling_seed: 20261010
  case_source_groups:
    sage: 32
    r2r: 16
    rxr: 16
  harness_version: v8
  compact_zero_advantage_waves: false
  v8_prefix_cache: true
  learner_cpus_per_rank: 4
  colocated_vllm_replicas: 64
  fast_policy_device: colocated_cuda
  fast_policy_cpus: 8
  optimizer_cpu_during_backward: false
  text_before_fm: true
  text_backend: megatron
  megatron_tp: 2
  megatron_pp: 2
  megatron_cp: 8
  megatron_ep: 16
  megatron_etp: 1
  update_replay_dir: ''
  update_backend_audit_input: ''
  learner_collectives_only: false
  trajectory_transfer_queue: true
  group_partial_rollout: true
  megatron_dynamic_bsz: true
  megatron_max_token_len_per_gpu: 16384
  cpu_group_preparation: true
  native_colocated_weight_sync: true
  v8_cuda_graphs: true
  megatron_cpu_prefetch: true
  fm_prefix_reuse: true
  overlap_cpu_group_preparation: true

# 模型、数据和依赖使用本机路径，可用 key=value 直接覆盖或从Shell环境读取。
checkpoint: ${oc.env:INITIAL_CHECKPOINT}
bench_urls: ${oc.env:BENCH_URLS}
environment:
  VERL_SOURCE_ROOT: ${oc.env:VERL_SOURCE_ROOT}
  ACTION_HEAD_MEGATRON_ENV: ${oc.env:MEGATRON_ENV}
  SAGE_SOURCE_OBJECT_MAP: ${oc.env:SAGE_SOURCE_OBJECT_MAP}
  ACTION_HEAD_CPU_GROUP_PREP_TASKS_PER_NODE: '2'
  ACTION_HEAD_EXECUTION_PROFILE: v7_v3_collision
  ACTION_HEAD_REQUIRE_QWEN_FAST_PATH: '1'

# Hydra不切换工作目录、不在代码仓生成outputs/.hydra；解析后的配置由入口保存到实验目录。
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
